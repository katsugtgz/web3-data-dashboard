# Web3 Radar self-hosted stack.
# Copy .env.example to .env and fill in what you use, then: docker compose up -d --build
# Services reach each other by name on a private bridge network (web3-radar:3000,
# rsshub:1200, redis:6379). The dashboard itself is published on host loopback only;
# public traffic comes in through the cloudflared tunnel (service URL http://web3-radar:3000).

services:
  web3-radar:
    build: .
    restart: unless-stopped
    # Runs as the account that owns ./data, so the bind mount is writable.
    user: "${RADAR_UID:-1000}:${RADAR_GID:-1000}"
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/radar.sqlite
      X_RSS_MIRROR_BASE: http://rsshub:1200/twitter/user
      PORT: "3000"
    depends_on:
      rsshub:
        condition: service_started

  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/
      CACHE_EXPIRE: "300"
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
      TWITTER_USERNAME: ${TWITTER_USERNAME:-}
      TWITTER_PASSWORD: ${TWITTER_PASSWORD:-}
      TWITTER_PHONE_OR_EMAIL: ${TWITTER_PHONE_OR_EMAIL:-}
      TWITTER_AUTHENTICATION_SECRET: ${TWITTER_AUTHENTICATION_SECRET:-}
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru

  # Stays enabled so that setting CLOUDFLARE_TUNNEL_TOKEN in .env starts the tunnel
  # without touching this file. Without a token the container exits and restarts
  # until one is provided.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web3-radar:
        condition: service_started

networks:
  default:
    driver: bridge
