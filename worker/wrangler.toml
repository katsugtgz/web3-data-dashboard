name = "web3-radar"
main = "src/index.ts"
compatibility_date = "2026-11-21"

[vars]
TG_BATCH_SIZE = "4"
X_BATCH_SIZE = "3"
AI_DAILY_MAX = "300"
AI_SUMMARY_CHUNK = "6"

[ai]
binding = "AI"

[triggers]
crons = ["* * * * *", "*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "web3-radar"
database_id = "8aab65b6-5de8-4cff-9ea6-14e0e286c0b0"
migrations_dir = "migrations"
