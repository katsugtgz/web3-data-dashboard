name: Deploy Cloudflare Worker

# Manual only. Production runs on the Docker deployment (see
# .github/workflows/deploy-srv2.yml); deploying the Worker and its crons is an
# explicit decision.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  # Deploys apply remote D1 migrations before deploying: canceling a run
  # mid-migration leaves schema and Worker out of step. Let in-flight runs
  # finish; the newest queued run follows.
  cancel-in-progress: false

jobs:
  deploy:
    # `production` must be configured in repo settings (Environments →
    # production) with required reviewers: the workflow itself cannot enforce
    # reviewer approval, and without it any workflow_dispatch ref runs with
    # the Cloudflare token.
    environment: production
    runs-on: ubuntu-latest
    # cancel-in-progress is false above: without a timeout a hung wrangler
    # call blocks every later deploy for up to GitHub's 6h job default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install ripgrep
        run: |
          command -v rg >/dev/null || (sudo apt-get update -q && sudo apt-get install -yq ripgrep)
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test
      - name: Check zero CJK in code
        run: bash scripts/check-no-cjk.sh
      - name: Deploy Worker & apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            # A deploy that reports green while deploying nothing hides the misconfiguration.
            echo "::error::Deploy requested but CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not configured."
            exit 1
          fi
          npx wrangler d1 migrations apply DB --remote
          npx wrangler deploy
