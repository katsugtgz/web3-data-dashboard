name: Deploy Cloudflare Worker

on:
  push:
    branches: [master]
    paths:
      - 'worker/**'
      - 'shared/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  # Deploys apply remote D1 migrations before deploying: canceling a run
  # mid-migration leaves schema and Worker out of step. Let in-flight runs
  # finish; the newest queued run follows.
  cancel-in-progress: false

jobs:
  deploy:
    # `production` must be configured in repo settings (Environments →
    # production) with required reviewers: the workflow itself cannot enforce
    # reviewer approval, and without it any workflow_dispatch ref runs with
    # the Cloudflare token.
    environment: production
    runs-on: ubuntu-latest
    # cancel-in-progress is false above: without a timeout a hung wrangler
    # call blocks every later deploy for up to GitHub's 6h job default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Deploy Worker & apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            # Dry-run is only acceptable for pushes before credentials exist.
            # Once a deploy is explicitly requested (workflow_dispatch), a
            # green no-op would hide the misconfiguration.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Deploy requested but CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not configured."
              exit 1
            fi
            echo "::notice::Cloudflare secrets not configured; running dry-run only (configure secrets to enable deploys)."
            npx wrangler deploy --dry-run
            exit 0
          fi
          npx wrangler d1 migrations apply DB --remote
          npx wrangler deploy
