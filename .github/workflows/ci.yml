name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build local bundle
        run: bun run build
        env:
          GITHUB_ACTIONS: ''
      - name: Build GitHub Pages bundle
        run: bun run build:pages
        env:
          GITHUB_ACTIONS: 'true'
          VITE_STATIC: '1'
      - name: Verify Pages snapshot artifact
        run: test -f dist/data/dashboard.json
