name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Test, CJK & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test
      - name: Check zero CJK in code
        run: bash scripts/check-no-cjk.sh
      - name: Worker deploy dry-run
        working-directory: worker
        run: npx wrangler deploy --dry-run
      - name: Build local bundle
        run: bun run build
        env:
          VITE_BASE: '/'
      - name: Build GitHub Pages bundle
        run: bun run build:pages
        env:
          GITHUB_ACTIONS: 'true'
          VITE_STATIC: '1'
      - name: Verify Pages snapshot artifacts
        run: |
          jq -e 'type == "object" and (.cards | type == "array" and length > 0)' dist/data/airdrops.json > /dev/null
          jq -e 'type == "object" and (.sections | type == "array" and length >= 6)' dist/data/markets.json > /dev/null
      - name: Check zero CJK in dist
        run: |
          if rg --pcre2 '\p{Script=Han}' dist/; then
            echo "ERROR: CJK found in dist/"
            exit 1
          fi
