name: Heavy Market Ingest (DefiLlama)

# Manual only. The Docker deployment (server/scheduler.ts) runs this ingest
# in-process every 30 minutes; this workflow remains for writing to the
# Cloudflare D1 database by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-heavy
  # Each run writes to remote D1; canceling mid-ingest may leave it half-done
  # and never retried, so let an in-flight ingest finish.
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Run heavy ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::notice::Cloudflare secrets not configured; running --dry-run."
            bun run ingest:heavy -- --dry-run
            exit 0
          fi
          bun run ingest:heavy
