name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install ripgrep
        run: |
          command -v rg >/dev/null || (sudo apt-get update -q && sudo apt-get install -yq ripgrep)
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test
      - name: Check zero CJK in code
        run: bash scripts/check-no-cjk.sh
      - name: Check zero gambling/betting airdrops in snapshot
        run: bun run check:gambling
      - name: Build GitHub Pages bundle
        run: bun run build:pages
        env:
          GITHUB_ACTIONS: 'true'
          VITE_STATIC: '1'
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      - name: Verify Pages snapshot artifacts
        run: |
          jq -e 'type == "object" and (.cards | type == "array" and length > 0)' dist/data/airdrops.json > /dev/null
          jq -e 'type == "object" and (.sections | type == "array" and length >= 6)' dist/data/markets.json > /dev/null
          jq -e 'type == "object" and (.items | type == "array" and length > 0)' dist/data/feed.json > /dev/null
          jq -e 'type == "array" and length > 0' dist/data/sources.json > /dev/null
          bun scripts/check-no-gambling.mts dist/data
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
